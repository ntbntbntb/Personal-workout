<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081712"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Yoga for Climbers</title><style>:root{--safe:env(safe-area-inset-bottom)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#071510,#10261d);color:#f5fbf7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.home{position:fixed;z-index:99;right:12px;top:calc(10px + env(safe-area-inset-top));background:#0c2019e8;color:white;text-decoration:none;border:1px solid #4f7865;padding:9px 12px;border-radius:20px;font-weight:750;font-size:13px}header{max-width:780px;margin:auto;padding:24px 15px 11px}h1{font-size:29px;margin:0}.sub{color:#aec8ba;margin-top:5px}.wrap{position:sticky;top:0;z-index:20;background:#071510f2;padding:8px 12px 10px;border-bottom:1px solid #29483a;backdrop-filter:blur(12px)}.player{max-width:780px;margin:auto;aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.now{max-width:780px;margin:8px auto 0;display:flex;gap:9px}.now b{color:#8be3b5}.status{margin-left:auto;color:#9bb4a7;font-size:12px}.info{max-width:780px;margin:12px auto;padding:0 14px;color:#b8cbbf;font-size:13px}.list{max-width:780px;margin:auto;padding:0 12px calc(88px + var(--safe))}.move{width:100%;border:1px solid #315643;background:#102b20;color:white;border-radius:14px;padding:13px;margin:7px 0;text-align:left;display:grid;grid-template-columns:58px 1fr;gap:10px}.move.active{border-color:#72daa6;background:#173a2b}.time{font-weight:850;color:#8be3b5}.name{font-weight:780}.muscles{display:block;color:#9fbaab;font-size:13px;margin-top:4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#091b14ed;border-top:1px solid #315442;padding:8px 12px calc(8px + var(--safe));display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button{border:0;border-radius:12px;padding:13px;background:#24563f;color:white;font-weight:800}.bottom .next{background:#21895a}</style></head><body><a class="home" href="index.html">⌂ Workouts</a><header><h1>🧗‍♂️ Yoga for Climbers</h1><div class="sub">Flexibiliteit · balans · coördinatie · stabiliteit</div></header><div class="wrap"><div class="player"><iframe id="player" title="Yoga for Climbers" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="now"><b id="time">00:32</b><span id="title">Start & ademhaling</span><span class="status" id="status">laden…</span></div></div><p class="info">Tik op een hoofdstuk om binnen dezelfde video te springen. De tijden volgen de hoofdstukken uit de videotranscriptie.</p><main class="list" id="list"></main><div class="bottom"><button id="prev">← Vorige</button><button class="next" id="next">Volgende →</button></div><script>const items=[{"name":"Introduction","time":"00:00","seconds":0,"muscles":"Introductie van de training"},{"name":"Warm-up","time":"00:31","seconds":31,"muscles":"Ademhaling • nek • houding"},{"name":"Chest opening","time":"03:02","seconds":182,"muscles":"Borst • schouders • bovenrug"},{"name":"Arm and chest stretches","time":"05:49","seconds":349,"muscles":"Armen • borst • schouders"},{"name":"Sun salutations","time":"08:31","seconds":511,"muscles":"Hele lichaam • mobiliteit • ademhaling"},{"name":"Balance and core","time":"10:45","seconds":645,"muscles":"Core • balans • bilspieren"},{"name":"Plank and downward dog","time":"15:39","seconds":939,"muscles":"Core • schouders • polsen • achterste keten"},{"name":"Lunges and side angles","time":"19:11","seconds":1151,"muscles":"Heupen • hamstrings • borstrotatie"},{"name":"Modified half moon","time":"22:04","seconds":1324,"muscles":"Balans • core • buitenste heup"},{"name":"Floor stretches","time":"24:19","seconds":1459,"muscles":"Schouders • bovenrug • heupen"},{"name":"Seated forward bend","time":"26:02","seconds":1562,"muscles":"Hamstrings • onderrug • ademhaling"},{"name":"Conclusion","time":"27:50","seconds":1670,"muscles":"Cooling-down • meditatie"}];let current=0,player,ready=false;const origin=/^https?:$/.test(location.protocol)?location.origin:'';const frame=document.getElementById('player');const params=new URLSearchParams({enablejsapi:'1',playsinline:'1',rel:'0',start:String(items[0].seconds)});if(origin)params.set('origin',origin);frame.src='https://www.youtube.com/embed/7yOtsZNU4Us?'+params;function render(){items.forEach((x,i)=>{const b=document.createElement('button');b.className='move';b.dataset.i=i;b.innerHTML=`<span class="time">${x.time}</span><span><span class="name">${x.name}</span><span class="muscles">${x.muscles}</span></span>`;b.onclick=()=>select(i,true);list.appendChild(b)})}function select(i,play){current=Math.max(0,Math.min(items.length-1,i));const x=items[current];time.textContent=x.time;title.textContent=x.name;document.querySelectorAll('.move').forEach((b,j)=>b.classList.toggle('active',j===current));if(ready){player.seekTo(x.seconds,true);if(play)player.playVideo();status.textContent=play?'speelt':'gereed'}}window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{events:{onReady:()=>{ready=true;status.textContent='gereed';select(0,false)},onError:e=>status.textContent='spelerfout '+e.data}})};prev.onclick=()=>select(current-1,true);next.onclick=()=>select(current+1,true);render();select(0,false);const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);</script></body></html>
